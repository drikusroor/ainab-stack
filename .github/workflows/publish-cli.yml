name: Publish CLI Package

on:
  push:
    branches:
      - main
    paths:
      - 'packages/create-ainab-stack/**'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: packages/create-ainab-stack

      - name: Setup .npmrc
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > packages/create-ainab-stack/.npmrc

      - name: Publish to GitHub Packages
        run: bun publish
        working-directory: packages/create-ainab-stack
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
